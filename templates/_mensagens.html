{% if messages %}
  <div class="mensagens nao-imprimir" role="status" aria-live="polite">
    {% for mensagem in messages %}
      <div class="alert alert-{{ mensagem.tags }} alert-dismissible fade show d-flex align-items-center gap-2" data-fechar-auto>
        {% if mensagem.tags == "success" %}<i class="bi bi-check-circle-fill" aria-hidden="true"></i>
        {% elif mensagem.tags == "danger" %}<i class="bi bi-exclamation-octagon-fill" aria-hidden="true"></i>
        {% else %}<i class="bi bi-info-circle-fill" aria-hidden="true"></i>{% endif %}
        <div>{{ mensagem }}</div>
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
      </div>
    {% endfor %}
  </div>
{% endif %}
