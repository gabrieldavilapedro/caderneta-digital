{% load caderneta_extras %}{% if produto.quantidade <= 0 %}<span class="badge badge-saldo bg-danger-subtle text-danger-emphasis">{{ produto.quantidade|quantidade:produto }}</span>{% elif produto.quantidade <= produto.estoque_minimo %}<span class="badge badge-saldo bg-warning-subtle text-warning-emphasis"><i class="bi bi-exclamation-triangle me-1" aria-hidden="true"></i>{{ produto.quantidade|quantidade:produto }}</span>{% else %}<span class="badge badge-saldo bg-body-secondary text-body">{{ produto.quantidade|quantidade:produto }}</span>{% endif %}
