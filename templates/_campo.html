<div class="mb-3">
  <label for="{{ campo.id_for_label }}" class="form-label fw-semibold">
    {{ campo.label }}{% if not campo.field.required %} <span class="fw-normal text-body-secondary">(opcional)</span>{% endif %}
  </label>
  {{ campo }}
  {% for erro in campo.errors %}<div class="invalid-feedback">{{ erro }}</div>{% endfor %}
  {% if campo.help_text %}<div class="form-text" id="{{ campo.auto_id }}_helptext">{{ campo.help_text|safe }}</div>{% endif %}
</div>
